<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Stage-1 system: store, monitors, controller, interventions, twin</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>

  <!-- input -->
  <rect x="20" y="250" width="140" height="56" rx="8" fill="#eef2f7" stroke="#4a5d78"/>
  <text x="90" y="273" text-anchor="middle" font-weight="bold">Query q</text>
  <text x="90" y="292" text-anchor="middle" font-size="11">[Q] s1 s2 r [A]</text>

  <!-- store A -->
  <rect x="200" y="150" width="210" height="260" rx="10" fill="#f3f7ee" stroke="#4f7a3a" stroke-width="1.5"/>
  <text x="305" y="172" text-anchor="middle" font-weight="bold">Store A (first-order)</text>
  <text x="305" y="189" text-anchor="middle" font-size="11">causal transformer, d=128, L=4</text>
  <g font-size="11">
    <rect x="222" y="200" width="166" height="26" fill="#fff" stroke="#9bb58a"/><text x="305" y="217" text-anchor="middle">layer 4</text>
    <rect x="222" y="232" width="166" height="26" fill="#fff" stroke="#9bb58a"/><text x="305" y="249" text-anchor="middle">layer 3</text>
    <rect x="222" y="264" width="166" height="26" fill="#fff" stroke="#9bb58a"/><text x="305" y="281" text-anchor="middle">layer 2</text>
    <rect x="222" y="296" width="166" height="26" fill="#fff" stroke="#9bb58a"/><text x="305" y="313" text-anchor="middle">layer 1</text>
    <rect x="222" y="328" width="166" height="26" fill="#fff" stroke="#9bb58a"/><text x="305" y="345" text-anchor="middle">embeddings (layer 0)</text>
  </g>
  <text x="305" y="374" text-anchor="middle" font-size="10.5">read set R: residual at s2, [A]; layers 0–4</text>
  <text x="305" y="392" text-anchor="middle" font-size="10.5">output: p(v | q) over the V values of r</text>
  <line x1="160" y1="278" x2="198" y2="278" stroke="#333" marker-end="url(#ar)"/>

  <!-- interventions -->
  <rect x="200" y="20" width="210" height="110" rx="8" fill="#fbeeee" stroke="#a04848"/>
  <text x="305" y="40" text-anchor="middle" font-weight="bold">Interventions (on store only)</text>
  <text x="212" y="58" font-size="11">primary held-out: T-FORGET on X</text>
  <text x="212" y="73" font-size="11">  + displacement-matched sham on Y</text>
  <text x="212" y="88" font-size="11">secondary: T-INTERF, T-NEW, T-FAM</text>
  <text x="212" y="103" font-size="11">exploratory: T-ACT, REPLACE</text>
  <text x="212" y="118" font-size="11">input-corruption control (on q, not store)</text>
  <line x1="305" y1="130" x2="305" y2="148" stroke="#a04848" stroke-width="2" marker-end="url(#ar)"/>

  <!-- monitors -->
  <rect x="470" y="120" width="230" height="320" rx="10" fill="#f6f1fb" stroke="#6a4c93" stroke-width="1.5"/>
  <text x="585" y="142" text-anchor="middle" font-weight="bold">Monitor M (second-order)</text>
  <text x="585" y="158" text-anchor="middle" font-size="11">outputs competence estimate p̂(correct)</text>
  <g font-size="11">
    <rect x="486" y="170" width="198" height="40" fill="#fff" stroke="#b39ddb"/>
    <text x="494" y="186">IN: reads q tokens only</text>
    <text x="494" y="201" fill="#666">(external observer baseline)</text>
    <rect x="486" y="216" width="198" height="40" fill="#fff" stroke="#b39ddb"/>
    <text x="494" y="232">OUT: sorted p(v|q) + entropy</text>
    <text x="494" y="247" fill="#666">(first-order readout baseline)</text>
    <rect x="486" y="262" width="198" height="110" fill="#fff" stroke="#6a4c93"/>
    <text x="494" y="278" font-weight="bold">INT: reads store read set R</text>
    <text x="494" y="296">developmental history (2×2):</text>
    <text x="494" y="312">S  intact final store only</text>
    <text x="494" y="327">T  store training checkpoints</text>
    <text x="494" y="342">P  random activation perturbation</text>
    <text x="494" y="357">TP T and P combined</text>
    <text x="494" y="392" fill="#666">all: equal steps, class-balanced</text>
    <text x="494" y="410" fill="#666">exploratory: OUT-TP, INT+OUT-S</text>
  </g>
  <line x1="410" y1="240" x2="484" y2="300" stroke="#333" marker-end="url(#ar)"/>
  <line x1="410" y1="380" x2="484" y2="236" stroke="#333" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M90,250 C90,90 440,100 484,188" fill="none" stroke="#333" stroke-dasharray="2 3" marker-end="url(#ar)"/>

  <!-- controller -->
  <rect x="760" y="210" width="200" height="130" rx="10" fill="#fff7e6" stroke="#b07a1c" stroke-width="1.5"/>
  <text x="860" y="232" text-anchor="middle" font-weight="bold">Controller C</text>
  <text x="860" y="250" text-anchor="middle" font-size="11">input: p̂ (+ cost c)</text>
  <text x="860" y="266" text-anchor="middle" font-size="11">trained on INTACT store only</text>
  <text x="772" y="292" font-size="11">→ ANSWER (use store output)</text>
  <text x="772" y="310" font-size="11">→ LOOKUP (external memory,</text>
  <text x="772" y="325" font-size="11">     correct answer, cost c)</text>
  <line x1="700" y1="280" x2="758" y2="280" stroke="#333" marker-end="url(#ar)"/>

  <!-- twin -->
  <rect x="200" y="470" width="210" height="80" rx="10" fill="#eef7f7" stroke="#2f7a7a"/>
  <text x="305" y="492" text-anchor="middle" font-weight="bold">Twin store B</text>
  <text x="305" y="510" text-anchor="middle" font-size="11">same world + data, other init seed</text>
  <text x="305" y="526" text-anchor="middle" font-size="11">own monitors; own interventions</text>
  <text x="305" y="542" text-anchor="middle" font-size="11">linear map B→A fit on INTACT states</text>
  <rect x="470" y="470" width="230" height="80" rx="10" fill="#eef7f7" stroke="#2f7a7a"/>
  <text x="585" y="492" text-anchor="middle" font-weight="bold">Self-specificity test</text>
  <text x="585" y="510" text-anchor="middle" font-size="11">A→A, B→B, A→B(raw), A→B̃(aligned),</text>
  <text x="585" y="526" text-anchor="middle" font-size="11">B̃→B̃ (fair same-space comparison),</text>
  <text x="585" y="542" text-anchor="middle" font-size="11">twin-access control, input-only</text>
  <line x1="410" y1="510" x2="468" y2="510" stroke="#2f7a7a" marker-end="url(#ar)"/>

  <!-- legend -->
  <text x="20" y="590" font-size="11" font-weight="bold">Separability</text>
  <text x="20" y="607" font-size="11">Store, monitor and controller are trained separately and can be intervened on, ablated or swapped independently.</text>
  <text x="20" y="623" font-size="11">No component ever sees data from a held-out intervention class. Dashed arrows are baseline information routes.</text>
</svg>
